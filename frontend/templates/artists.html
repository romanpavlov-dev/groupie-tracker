<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Список артистов</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .artist { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .artist img { max-width: 150px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Наши артисты</h1>

    {{range .}}
    <div class="artist">
        <img src="{{.Image}}" alt="{{.Name}}">
        <h2>{{.Name}}</h2>
        <p>Дата создания: {{.CreationDate}}</p>
        <p>Первый альбом: {{.FirstAlbum}}</p>
        <p>Локации: {{.Locations}}</p>
        <p>Даты концерта: {{.ConcertDates}}</p>
        <p>Участники: {{range .Members}}{{.}}, {{end}}</p>
    </div>
    {{end}}
</body>
</html>
