<!-- ============================================================
     ГЛАВНАЯ СТРАНИЦА — список всех артистов
     Сюда Go передаёт api.Views (СПИСОК артистов)

     ВАЖНО: Go читает двойные фигурные скобки ВЕЗДЕ, даже внутри
     HTML-комментариев. Поэтому в пояснениях ниже я НЕ пишу их,
     иначе Go примет их за настоящую команду и выдаст ошибку.
     ============================================================ -->

<!-- DOCTYPE говорит браузеру: "это современный HTML5".
     Должен стоять самой первой строкой файла. -->
<!DOCTYPE html>

<!-- html — корневой тег, внутри него вообще всё.
     lang="ru" подсказывает браузеру язык страницы -->
<html lang="ru">

<!-- ============ HEAD ============
     Служебная часть. НЕ отображается на странице.
     Здесь настройки, заголовок вкладки и стили. -->
<head>

  <!-- кодировка: чтобы русские буквы не превратились в кракозябры -->
  <meta charset="UTF-8">

  <!-- чтобы страница нормально выглядела на телефоне
       (без этой строки телефон покажет уменьшенную десктопную версию) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- текст на вкладке браузера -->
  <title>Groupie Tracker — Артисты</title>

  <!-- ============ CSS ============
       Внутри style живут стили: как всё должно ВЫГЛЯДЕТЬ.
       Формат правила:
           селектор {  свойство: значение;  }
       Селектор = "к чему применить".
       .card  — точка означает "элемент с class=card"
       body   — без точки означает "тег body" -->
  <style>

    /* ---------- ОБЩИЕ НАСТРОЙКИ СТРАНИЦЫ ---------- */
    body {
      margin: 0;                    /* убрать отступ, который браузер ставит сам по умолчанию */
      padding: 40px 20px;           /* внутренний отступ: 40px сверху/снизу, 20px слева/справа */
      font-family: Arial, sans-serif;  /* шрифт. Если Arial нет — любой похожий */
      background: #f5f5f5;          /* цвет фона. #f5f5f5 = очень светло-серый */
      color: #222;                  /* цвет текста. #222 = почти чёрный */
    }

    /* h1 — главный заголовок страницы */
    h1 {
      text-align: center;           /* текст по центру */
      margin-bottom: 30px;          /* отступ СНАРУЖИ снизу — воздух до карточек */
    }

    /* ---------- СЕТКА КАРТОЧЕК ----------
       display: grid включает режим сетки:
       браузер сам разложит карточки по колонкам и строкам. */
    .grid {
      display: grid;

      /* Самая сложная строка. Читается так:
         repeat(auto-fill, ...) = "натолкай столько колонок, сколько влезет"
         minmax(240px, 1fr)     = "колонка минимум 240px, максимум — занять свободное место"
         Итог: на широком экране 4 колонки, на телефоне 1. Всё автоматически. */
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));

      gap: 20px;                    /* расстояние МЕЖДУ карточками */
      max-width: 1100px;            /* сетка не шире 1100px, чтобы на большом мониторе не растягивалась */
      margin: 0 auto;               /* 0 сверху/снизу, auto слева/справа = центрирование блока */
    }

    /* ---------- ОДНА КАРТОЧКА ----------
       Важно: карточка — это тег a, то есть ССЫЛКА.
       Поэтому кликабельна вся карточка целиком, а не только текст. */
    .card {
      display: block;               /* по умолчанию ссылка ведёт себя как текст (строчный элемент).
                                       block заставляет вести себя как прямоугольный блок */
      background: #fff;             /* белый фон карточки */
      border: 1px solid #ddd;       /* рамка: толщина 1px, сплошная, светло-серая */
      border-radius: 6px;           /* скруглить углы на 6px */
      overflow: hidden;             /* обрезать всё, что вылезает за скруглённые углы
                                       (без этого углы картинки торчали бы наружу) */
      text-decoration: none;        /* убрать подчёркивание, которое браузер рисует у ссылок */
      color: inherit;               /* взять цвет текста от родителя, а не стандартный синий цвет ссылки */
    }

    /* :hover = "когда мышка наведена на элемент" */
    .card:hover {
      border-color: #888;           /* рамка темнеет — видно, что это кликабельно */
    }

    /* картинка ВНУТРИ карточки.
       Запись ".card img" означает: тег img, который лежит внутри .card */
    .card img {
      width: 100%;                  /* ширина = вся ширина карточки */
      height: 180px;                /* фиксированная высота, чтобы все карточки были ровные */
      object-fit: cover;            /* картинка заполняет блок и обрезается по краям,
                                       НЕ сплющиваясь (без этого фото было бы искажённым) */
      display: block;               /* убирает лишний зазор под картинкой */
    }

    /* блок с текстом под картинкой */
    .card-body {
      padding: 12px;                /* внутренний отступ, чтобы текст не липнул к рамке */
    }

    .card h2 {
      font-size: 18px;              /* размер шрифта имени артиста */
      margin: 0 0 8px;              /* сверху 0, по бокам 0, снизу 8px */
    }

    .card p {
      margin: 0;                    /* убрать стандартные отступы у абзаца */
      font-size: 14px;              /* помельче, чем имя */
      color: #666;                  /* серый — второстепенная информация */
    }
  </style>
</head>


<!-- ============ BODY ============
     Всё, что видит пользователь на экране. -->
<body>

  <!-- заголовок страницы -->
  <h1>Артисты</h1>

  <!-- контейнер-сетка, внутрь него попадут все карточки -->
  <div class="grid">

    <!-- ============ ЦИКЛ ПО АРТИСТАМ ============
         Двойные фигурные скобки — это НЕ HTML, а команды шаблонизатора Go.
         Браузер их никогда не видит: Go подставляет данные ещё на сервере.

         Команда range = "пройди по списку и повтори всё до end для каждого элемента"

         Точка "." — это данные, которые пришли из Go (api.Views, список артистов).
         ВНУТРИ цикла точка меняет смысл: теперь "." = один текущий артист. -->
    {{range .}}

      <!-- href — адрес, куда ведёт ссылка.
           Вместо .ID Go подставит реальный номер, получится /artist?id=7
           Именно по этому id ArtistHandler найдёт артиста в мапе ViewsByID. -->
      <a class="card" href="/artist?id={{.ID}}">

        <!-- src — откуда взять картинку (ссылка на фото из API)
             alt — текст, если картинка не загрузилась -->
        <img src="{{.Image}}" alt="{{.Name}}">

        <div class="card-body">
          <!-- .Name, .CreationDate, .FirstAlbum — поля структуры ArtistView -->
          <h2>{{.Name}}</h2>
          <p>Основана: {{.CreationDate}}</p>
          <p>Первый альбом: <span class="js-date" data-raw="{{.FirstAlbum}}">{{.FirstAlbum}}</span></p>
        </div>

      </a>

    <!-- end закрывает цикл range.
         Каждый открытый range или if ОБЯЗАН иметь свой end, иначе Go выдаст ошибку. -->
    {{end}}

  </div>

</body>
<script>
  function formatLocation(raw) {
    return raw
      .split('-')
      .map(part =>
        part
          .split('_')
          .map(w => w.charAt(0).toUpperCase() + w.slice(1))
          .join(' ')
      )
      .join(', ');
  }

  function formatDate(raw) {
    raw = raw.replace('*', '');
    const [day, month, year] = raw.split('-');
    const date = new Date(`${year}-${month}-${day}`);
    return date.toLocaleDateString('en-GB', {
      day: '2-digit',
      month: 'short',
      year: 'numeric',
    });
  }

  document.querySelectorAll('.js-location').forEach(el => {
    el.textContent = formatLocation(el.dataset.raw);
  });

  document.querySelectorAll('.js-date').forEach(el => {
    el.textContent = formatDate(el.dataset.raw);
  });
</script>
</html>
